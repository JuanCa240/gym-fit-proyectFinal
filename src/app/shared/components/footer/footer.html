
<footer class="footer" id="contacto">

  <div class="footer-container">

    <!-- Encabezado del footer -->
    <div class="footer-header">

      <a class="footer-logo" routerLink="/">
        Tu<span>Gym</span>
      </a>

      <!-- Redes sociales -->
      <div class="social-links">

        <button type="button" class="social-icon instagram"
                aria-label="Instagram" disabled>
          <i class="fa-brands fa-instagram" aria-hidden="true"></i>
        </button>

        <button type="button" class="social-icon twitter"
                aria-label="X Twitter" disabled>
          <i class="fa-brands fa-x-twitter" aria-hidden="true"></i>
        </button>

       <button type="button" class="social-icon tiktok"
                aria-label="TikTok" disabled>
        <i class="fa-brands fa-tiktok" aria-hidden="true"></i>
       </button>
       
      </div>
    </div>

    <!-- Contenido principal del footer -->
    <div class="footer-content">

      <!-- Información del gimnasio -->
      <div class="footer-column">

        <h3>Nosotros</h3>

        <p>
          Un espacio para entrenar, mejorar y alcanzar
          tus objetivos.
        </p>

      </div>

      <!-- Enlaces de navegación -->
      <div class="footer-column">

        <h3>Explorar</h3>

        <ul>
          <li><a routerLink="/">Inicio</a></li>
          <li><a routerLink="/" fragment="planes">Membresías</a></li>
          <li><span>Nuestras sedes</span></li>
          <li><span>Rutinas</span></li>
        </ul>

      </div>

      <!-- Información de contacto -->
      <div class="footer-column">

        <h3>Contacto</h3>

        <ul class="contact-list">

          <li>
            <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
            <span>+57 3147553208</span>
          </li>

          <li>
            <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
            <span>Colombia</span>
          </li>

          <li>
            <i class="fa-regular fa-clock" aria-hidden="true"></i>
            <span>Horarios de atención</span>
          </li>

        </ul>
      </div>
    </div>

    <!-- Parte inferior del footer -->
    <div class="footer-bottom">

      <p> © {{ currentYear }} TuGym. Todos los derechos reservados. </p>

      <a routerLink="/" fragment="terminos"> Términos y condiciones </a>

    </div>
  </div>

</footer>

<!-- Botón flotante de contacto -->
<button
  type="button"
  class="floating-contact"
  aria-label="Contactar con TuGym por WhatsApp"
>
  <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>

  <span>¿Duda? Escríbenos</span>
</button>
