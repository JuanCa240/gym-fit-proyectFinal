<header class="header">

    <!-- Logo de TuGym -->
    <a class="logo" routerLink="/">
        <img src="images/TuGym_logo_circle.png" alt="Logo de TuGym">
    </a>

    <!-- Botón del menú para dispositivos móviles -->
    <button
        class="menu-toggle"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-label]="menuOpen ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
        [attr.aria-expanded]="menuOpen"
        aria-controls="main-navigation"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Menú de navegación -->
    <nav
        id="main-navigation"
        class="nav-links"
        [class.active]="menuOpen"
        aria-label="Navegación principal"
    >
        <a href="#planes">Planes</a>
        <a href="#terminos">Términos</a>
        <a href="#contacto">Contacto</a>
    </nav>

    <!-- Acceso al login -->
    <a class="btn-login" [class.active]="menuOpen" href="/login">
        Iniciar sesión
    </a>

</header>
